name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

jobs:
  abi:
    name: ABI consistency
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      # The parsers are ABI 15; the CMake default must match so a CMake build never regenerates them with another ABI.
      - name: Compare parser.c and CMake ABI
        run: |-
          grep -qx '#define LANGUAGE_VERSION 15' typescript/src/parser.c
          grep -qx '#define LANGUAGE_VERSION 15' tsx/src/parser.c
          grep -q 'set(TREE_SITTER_ABI_VERSION 15 CACHE' CMakeLists.txt
  test:
    name: Test parsers
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up tree-sitter
        uses: tree-sitter/setup-action/cli@v2
        with:
          tree-sitter-ref: v0.27.2
      # Generate only the two grammars; third_party/ holds an input, not a grammar to build.
      - name: Verify generated parsers
        shell: bash
        run: |-
          for grammar in typescript tsx; do
            (cd "$grammar" && tree-sitter generate --abi 15 --js-runtime native)
          done
          git diff --exit-code -- typescript/src tsx/src
      - name: Set up examples
        run: |-
          git clone https://github.com/desktop/desktop examples/desktop --single-branch --depth=1 --filter=blob:none
          git clone https://github.com/reduxjs/redux examples/redux --single-branch --depth=1 --filter=blob:none
          git clone https://github.com/microsoft/vscode examples/vscode --single-branch --depth=1 --filter=blob:none
      - name: Run tests
        uses: tree-sitter/parser-test-action@v3
        with:
          generate: false
          test-rust: true
          test-node: true
          test-python: true
          test-go: true
          test-swift: true
      - name: Parse examples
        id: test
        uses: tree-sitter/parse-action@v4
        with:
          files: |
            examples/**/*.ts
            examples/**/*.tsx
            !examples/redux/src/types/store.ts
            !examples/vscode/src/bootstrap-window.ts
