name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

jobs:
  abi:
    name: ABI consistency
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      # ci/tree-sitter-abi.txt pins the ABI. Generation and the CMake default read it; the committed parsers and the npm
      # build scripts repeat it, so a CMake build or npm run build never regenerates them with another ABI.
      - name: Compare parser.c and npm build scripts with the ABI pin
        shell: bash
        run: |-
          abi=$(cat ci/tree-sitter-abi.txt)
          for grammar in typescript tsx; do
            grep -qx "#define LANGUAGE_VERSION $abi" "$grammar/src/parser.c" ||
              { echo "$grammar/src/parser.c is not ABI $abi"; exit 1; }
            build=$(node -p "require('./$grammar/package.json').scripts.build")
            test "$build" = "tree-sitter generate --abi $abi --js-runtime native" ||
              { echo "$grammar/package.json build script differs from the CI recipe: $build"; exit 1; }
          done
  versions:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      # Every manifest and the latest CHANGELOG release carry one version (ADR-0001 amendment, Decision 4).
      - name: Compare manifest versions
        shell: bash
        run: |-
          versions=$(
            echo "package.json $(jq -r .version package.json)"
            echo "package-lock.json $(jq -r '.version + " " + .packages[""].version' package-lock.json)"
            echo "tree-sitter.json $(jq -r .metadata.version tree-sitter.json)"
            echo "Cargo.toml $(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
            echo "Cargo.lock $(grep -A1 -x 'name = "tree-sitter-typescript"' Cargo.lock | grep -m1 '^version = ' | cut -d'"' -f2)"
            echo "pyproject.toml $(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)"
            echo "CMakeLists.txt $(grep -m1 -o 'VERSION "[^"]*"' CMakeLists.txt | cut -d'"' -f2)"
            echo "common/common.mak $(sed -n 's/^VERSION := //p' common/common.mak)"
            echo "CHANGELOG.md $(grep -m1 -o '^## \[[^]]*\]' CHANGELOG.md | tr -d '#[] ')"
          )
          echo "$versions"
          test "$(echo "$versions" | cut -d' ' -f2- | tr ' ' '\n' | sort -u | grep -c .)" -eq 1 \
            && test "$(echo "$versions" | cut -d' ' -f2- | tr ' ' '\n' | grep -c .)" -eq 10
  known-failures:
    name: Known failures only shrink
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # On pull_request the checkout is the merge commit; its first parent is the base branch.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Compare known-failures.txt with the base branch
        run: bash test/examples/check-known-failures-shrink.sh HEAD^1
  test:
    name: Test parsers
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Read tree-sitter CLI pin
        id: tree-sitter-pin
        shell: bash
        run: node -p '"ref=v" + require("./package.json").devDependencies["tree-sitter-cli"]' >> "$GITHUB_OUTPUT"
      - name: Set up tree-sitter
        uses: tree-sitter/setup-action/cli@v2
        with:
          tree-sitter-ref: ${{ steps.tree-sitter-pin.outputs.ref }}
      # Generate only the two grammars; third_party/ holds an input, not a grammar to build.
      - name: Verify generated parsers
        shell: bash
        run: |-
          abi=$(cat ci/tree-sitter-abi.txt)
          for grammar in typescript tsx; do
            (cd "$grammar" && tree-sitter generate --abi "$abi" --js-runtime native)
          done
          awk '
            FNR == 1 { in_main_lexer = 0 }
            /^static bool ts_lex\(/ { in_main_lexer = 1 }
            /^}/ { in_main_lexer = 0 }
            in_main_lexer && /^[[:space:]]*case [0-9]+:/ { cases[FILENAME]++ }
            /^[[:space:]]*#[[:space:]]*pragma[[:space:]]+(optimize[[:space:]]*\(|clang[[:space:]]+optimize[[:space:]]+off([[:space:]]|$)|GCC[[:space:]]+optimize([[:space:](]|$))/ {
              print FILENAME ":" FNR ": forbidden optimization pragma: " $0
              blocked = 1
            }
            END {
              for (i = 1; i < ARGC; i++) {
                n = cases[ARGV[i]] + 0
                print ARGV[i] ": main lexer cases: " n
                if (!n) blocked = 1
              }
              exit blocked
            }
          ' typescript/src/parser.c tsx/src/parser.c
          git diff --exit-code -- typescript/src tsx/src
          # A file the generator adds is untracked, which git diff does not report.
          extra=$(git status --porcelain --untracked-files=all -- typescript/src tsx/src)
          test -z "$extra" || { echo "$extra"; exit 1; }
      # Example repositories at the commits pinned in test/examples/repos.txt.
      - name: Set up examples
        shell: bash
        run: |-
          grep -v '^#' test/examples/repos.txt | while read -r name url commit; do
            [ -n "$name" ] || continue
            git init -q "examples/$name"
            git -C "examples/$name" fetch -q --depth=1 --filter=blob:none "$url" "$commit"
            git -C "examples/$name" -c advice.detachedHead=false checkout -q FETCH_HEAD
            test "$(git -C "examples/$name" rev-parse HEAD)" = "$commit"
          done
      - name: Run tests
        uses: tree-sitter/parser-test-action@v3
        with:
          generate: false
          test-rust: true
          test-node: true
          test-python: true
          test-go: true
      # Same commands as parser-test-action's Swift step, but with a serial build: on Windows, swift-build's parallel
      # tasks for the two resource bundles (TypeScript and TSX share queries/) failed with "Touch
      # ...TreeSitterTypeScript_TreeSitterTSX.bundle ... being used by another process" depending on task order.
      - name: Set up Swift
        uses: SwiftyLab/setup-swift@v1
        with:
          swift-version: "6.4"
      - name: Run Swift tests
        shell: sh
        run: |-
          swift build --build-tests -j 1
          swift test --skip-build -q
      # Every .ts/.tsx file must parse unless listed in test/examples/known-failures.txt; listed files must still fail.
      - name: Parse examples
        shell: bash
        run: node test/examples/parse-examples.mjs
  # tsc 7.0.2 (oracle/package.json) says which inputs are syntax; the replay checks both grammars agree through the
  # tree-sitter API. Needs only Node and Go (cgo with the runner's gcc); see oracle/README.md.
  oracle:
    name: Oracle replay
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          # The Go bindings #include parser.c from outside their package, which Go's build cache does not track:
          # a restored cache links the parser of an earlier run.
          cache: false
      - name: Install tsc
        working-directory: oracle
        run: npm ci --ignore-scripts
      - name: Self-test the runner
        run: node oracle/run.mjs --self-test
      - name: Regenerate verdicts
        shell: bash
        run: |-
          # git diff alone passes for a file that is not in the commit: require it to be tracked first.
          git ls-files --error-unmatch -- oracle/verdicts.json
          node oracle/run.mjs
          git diff --exit-code -- oracle/verdicts.json
      - name: Self-test the replay
        working-directory: oracle/replay
        run: go test -count=1 .
      - name: Replay verdicts against both grammars
        working-directory: oracle/replay
        run: go run . -oracle ..
      # Node kinds (named and anonymous) and field names are a public contract; a change shows up as a diff here.
      - name: Check the node-kind snapshot
        shell: bash
        run: |-
          git ls-files --error-unmatch -- test/node-kinds/typescript.txt test/node-kinds/tsx.txt
          node test/node-kinds/generate.mjs
          git diff --exit-code -- test/node-kinds
          test -z "$(git status --porcelain --untracked-files=all -- test/node-kinds)"
